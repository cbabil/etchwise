[package]
name = "imager-platform"
description = "OS-specific drive, raw-disk, Wi-Fi and power access for Etchwise"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
imager-core = { path = "../imager-core" }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
libc = "0.2"
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"] }
objc2-core-wlan = { version = "0.3", features = ["CWWiFiClient", "CWInterface"] }
objc2-core-location = { version = "0.3", features = ["CLLocationManager"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = "5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WiFi",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
