name: Feature request
description: Suggest an improvement or a new image for the list
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task or problem behind the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: What Etchwise should do. For a new image, give its name, the device it runs on and its download page.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Any workaround or other tool you use for this.
