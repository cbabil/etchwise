[package]
name = "pi-imager"
description = "Tauri shell of the Pi Imager port"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "pi_imager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
imager-core = { path = "../../../crates/imager-core" }
imager-platform = { path = "../../../crates/imager-platform" }
imager-rpiboot = { path = "../../../crates/imager-rpiboot" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
dirs = "6"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
